name: build

on:
  push:
    tags: ['*']

jobs:
  images:
    name: build ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Not strictly required for these Go images (the Dockerfiles cross-compile
      # from the build platform), but keeps the workflow correct if an app later
      # needs to RUN commands inside an arm64 stage.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push every app for amd64 + arm64
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          for dockerfile in */Dockerfile; do
            app="$(dirname "$dockerfile")"
            echo "::group::ghcr.io/$owner/$app:$TAG"
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --tag "ghcr.io/$owner/$app:$TAG" \
              --cache-from "type=gha,scope=$app" \
              --cache-to "type=gha,mode=max,scope=$app" \
              --push "$app"
            echo "::endgroup::"
          done
